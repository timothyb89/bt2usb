[package]
name = "hci-mux"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "HCI multiplexer for running Bluetooth Classic and BLE stacks concurrently on a single controller"

[dependencies]
bt-hci = { version = "0.8", default-features = false }
embassy-sync = { version = "0.7" }
embedded-io = "0.7"
futures-intrusive = { version = "0.5", default-features = false }
defmt = { version = "1", optional = true }

[features]
default = []
defmt = ["dep:defmt", "bt-hci/defmt", "embassy-sync/defmt"]
