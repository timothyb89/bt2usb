name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  DEFMT_LOG: info

jobs:
  firmware-lint:
    name: Firmware Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup show

      - uses: extractions/setup-just@v3

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Download CYW43 firmware
        run: just download-firmware

      - name: Lint
        run: just lint

  firmware-build:
    name: Firmware Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup show

      - uses: extractions/setup-just@v3

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Cache elf2uf2-rs
        id: cache-elf2uf2
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/elf2uf2-rs
          key: elf2uf2-rs-2.2.0-${{ runner.os }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install elf2uf2-rs
        if: steps.cache-elf2uf2.outputs.cache-hit != 'true'
        run: cargo install elf2uf2-rs --version 2.2.0 --locked

      - name: Download CYW43 firmware
        run: just download-firmware

      - name: Build UF2
        run: just build-uf2 release

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-elf
          path: target/thumbv6m-none-eabi/release/bt2usb

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-uf2
          path: bt2usb/bt2usb.uf2

  core-test:
    name: Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Test
        run: cargo test -p bt2usb-core

  cli-lint:
    name: CLI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Lint
        run: |
          cargo fmt --package bt2usb-cli --check
          cargo clippy --package bt2usb-cli -- -D warnings

  cli-build:
    name: CLI Build
    needs: firmware-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Download firmware ELF
        uses: actions/download-artifact@v8
        with:
          name: firmware-elf
          path: target/thumbv6m-none-eabi/release

      - name: Build
        run: cargo build --package bt2usb-cli --release
