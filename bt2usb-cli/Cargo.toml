[package]
name = "bt2usb-cli"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "bt2usb-cli"
path = "src/main.rs"

[dependencies]
# HID: disable default features to avoid Linux backend conflicts with probe-rs.
# The linux-native-basic-udev backend is selected via our default feature below,
# matching probe-rs's choice. Windows/macOS backends are always included.
hidapi = { version = "2", default-features = false, features = ["macos-shared-device", "windows-native"] }
minicbor = { version = "0.25", features = ["std"] }
cobs = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "3"
crossterm = "0.28"
defmt-decoder = "1"

# ELF parsing for UF2 conversion and defmt RTT address extraction
object = { version = "0.36", default-features = false, features = ["elf", "read"] }

# Optional: debug probe RTT support (heavy dep, behind feature flag)
probe-rs = { version = "0.31", optional = true }

[features]
default = ["hidapi/linux-native-basic-udev"]
probe = ["dep:probe-rs"]
