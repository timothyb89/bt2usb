[package]
name = "bt2usb-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure-logic modules for bt2usb firmware, testable on the host"

[dependencies]
heapless = "0.9"
minicbor = { version = "0.25", default-features = false, features = ["derive"] }
cobs = { version = "0.3", default-features = false }
defmt = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"

[features]
default = []
defmt = ["dep:defmt"]
